<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Связи форм и вьюх Locko</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; font: 13px/1.45 "Segoe UI", sans-serif; color: #1c1c1c; background: #f4f4f2; }
h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; }
.wrap { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.muted, .dim { color: #5c5c5c; }
.muted { margin: 0; max-width: 920px; }
.stats { display: flex; gap: 28px; flex-wrap: wrap; }
.stat b { display: block; font-size: 20px; font-weight: 600; }
.stat span { color: #5c5c5c; font-size: 12px; }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
input[type="search"] { min-width: 340px; padding: 7px 10px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
.pill, .btn { border: 1px solid #ccc; background: #fff; border-radius: 999px; padding: 4px 10px; cursor: pointer; font: inherit; }
.btn { border-radius: 6px; }
.btn.primary { background: #2f6fad; color: #fff; border-color: #2f6fad; }
.pill.active { background: #e7f0fa; border-color: #2f6fad; color: #1d4e80; }
.spacer { flex: 1; }
.results { border: 1px solid #ddd; border-radius: 6px; background: #fafafa; max-height: 200px; overflow: auto; max-width: 720px; }
.hit { display: flex; gap: 8px; padding: 5px 10px; cursor: pointer; border-bottom: 1px solid #eee; align-items: center; }
.hit:hover { background: #eef4fb; }
.kind { font-size: 9px; border: 1px solid #ccc; border-radius: 8px; padding: 0 6px; color: #666; white-space: nowrap; }
.mono { font-family: Consolas, ui-monospace, monospace; font-size: 12px; }
.grow { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.callout { background: #eef3f8; border-radius: 6px; padding: 10px 12px; font-size: 12.5px; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; align-items: start; }
.scroll { max-height: 720px; overflow: auto; border: 1px solid #ddd; border-radius: 6px; background: #fff; }
.side { display: flex; flex-direction: column; gap: 12px; }
.card { background: #fff; border: 1px solid #e4e4e4; border-radius: 8px; }
.card h2 { font-size: 13px; margin: 0; padding: 10px 12px; border-bottom: 1px solid #eee; font-weight: 600; }
.card .body { padding: 10px 12px; }
.legend, .leg { display: flex; gap: 8px; align-items: center; }
.legend { flex-direction: column; align-items: stretch; }
.leg span { font-size: 12px; color: #444; }
.list { max-height: 130px; overflow: auto; }
.link { color: #2f6fad; cursor: pointer; font-family: Consolas, ui-monospace, monospace; font-size: 11px; padding: 1px 0; }
.note { background: #f7f7f5; border-radius: 6px; padding: 10px 12px; font-size: 12px; color: #444; }
@media (max-width: 900px) { .main { grid-template-columns: 1fr; } input[type="search"] { min-width: 0; width: 100%; } }
</style>
</head>

    if (a.rank === b.rank) return { key: e.key, d: bezier(a.x + a.w, y1, b.x + b.w, y2) };
    const left = a.rank <= b.rank ? a : b;
    const right = a.rank <= b.rank ? b : a;
    const ly = a.rank <= b.rank ? y1 : y2;
    const ry = a.rank <= b.rank ? y2 : y1;
    return { key: e.key, d: bezier(left.x + left.w, ly, right.x, ry) };
  });
  if (!untangled) {
    let maxCount = 0;
    for (const [, arr] of byRank) maxCount = Math.max(maxCount, arr.length);
    return {
      cy, edges: baseEdges(), height: HEADER_H + PAD + maxCount * ROW_H + PAD,
      usedRanks: new Set(byRank.keys()), width: LAYOUT.width, copies: null, duplicateCount: 0,
    };
  }

  const yOf = (id) => LAYOUT.nodeById.get(id).y;
  const rankOf = (id) => LAYOUT.nodeById.get(id).rank;
  const outgoing = new Map();
  const indeg = new Map();
  const selfOf = new Set();
  for (const e of LAYOUT.edges) {
    if (!chain.edges.has(e.key)) continue;
    if (e.self || e.from === e.to) { selfOf.add(e.from); continue; }
    const ra = rankOf(e.from), rb = rankOf(e.to);
    const from = ra <= rb ? e.from : e.to;
    const to = ra <= rb ? e.to : e.from;
    const list = outgoing.get(from);
    if (list) list.push({ key: e.key, to }); else outgoing.set(from, [{ key: e.key, to }]);
    indeg.set(to, (indeg.get(to) || 0) + 1);
  }
  for (const list of outgoing.values()) list.sort((a, b) => yOf(a.to) - yOf(b.to));

  const raw = [];
  const atRank = new Map();
  const byKey = new Map();
  let seq = 0;
  const addCopy = (orig, rank, parent) => {
    const c = { key: "d" + (seq++), orig, rank, parent };
    raw.push(c);
    const list = atRank.get(rank);
    if (list) list.push(c); else atRank.set(rank, [c]);
    byKey.set(c.key, c);
    return c;
  };
  const seeds = [...chain.nodes].filter(id => !indeg.get(id)).sort((a, b) => yOf(a) - yOf(b) || rankOf(a) - rankOf(b));
  for (const id of seeds) addCopy(id, rankOf(id), null);
  const drawEdges = [];
  const selfDrawn = new Set();
  const MAX_COPIES = 500;
  const ancestorOrig = (key, orig) => {
    let k = key;
    const seen = new Set();
    while (k && !seen.has(k)) {
      seen.add(k);
      const c = byKey.get(k);
      if (!c) return null;
      if (c.orig === orig) return k;
      k = c.parent;
    }
    return null;
  };
  for (let r = 0; r <= 16 && raw.length < MAX_COPIES; r++) {
    const list = atRank.get(r);
    if (!list && r > 8) break;
    for (const c of [...(list || [])]) {
      if (selfOf.has(c.orig) && !selfDrawn.has(c.orig)) {
        selfDrawn.add(c.orig);
        drawEdges.push({ key: "self-" + c.key, from: c.key, to: c.key, self: true });
      }
      for (const e of outgoing.get(c.orig) || []) {
        const back = ancestorOrig(c.key, e.to);
        if (back && back !== c.key) {
          drawEdges.push({ key: e.key + "@" + c.key, from: c.key, to: back, self: false });
          continue;
        }
        if (raw.length >= MAX_COPIES) continue;
        const child = addCopy(e.to, r + 1, c.key);
        drawEdges.push({ key: e.key + "@" + child.key, from: c.key, to: child.key, self: false });
      }
    }
  }
  const dupTotal = new Map();
  for (const c of raw) dupTotal.set(c.orig, (dupTotal.get(c.orig) || 0) + 1);
  const dupSeen = new Map();
  let maxRank = 0, maxRows = 0;
  for (const [r, list] of atRank) { maxRank = Math.max(maxRank, r); maxRows = Math.max(maxRows, list.length); }
  const copies = raw.map(c => {
    const list = atRank.get(c.rank);
    const row = list.indexOf(c);
    const seen = (dupSeen.get(c.orig) || 0) + 1;
    dupSeen.set(c.orig, seen);
    const src = LAYOUT.nodeById.get(c.orig);
    return {
      key: c.key, orig: c.orig, rank: c.rank,
      x: LAYOUT.xOf(c.rank), y: HEADER_H + PAD + row * ROW_H,
      w: src.w, h: src.h, dupIndex: seen, dupTotal: dupTotal.get(c.orig) || 1,
    };
  });
  const copyPos = new Map(copies.map(c => [c.key, c]));
  for (const id of chain.nodes) {
    const first = copies.find(c => c.orig === id);
    if (first) cy.set(id, first.y);
  }
  const eds = [];
  for (const e of drawEdges) {
    const a = copyPos.get(e.from);
    const b = copyPos.get(e.to);
    if (!a || !b) continue;
    const y1 = a.y + a.h / 2, y2 = b.y + b.h / 2;
    eds.push({
      key: e.key,
      d: e.self
        ? "M" + (a.x + a.w) + "," + y1 + " c 30,-14 30,14 0," + (a.h * 0.9)
        : bezier(a.x + a.w, y1, b.x, y2),
    });
  }
  return {
    cy, edges: eds, height: HEADER_H + PAD + maxRows * ROW_H + PAD,
    usedRanks: new Set(atRank.keys()), width: LAYOUT.xOf(maxRank) + NODE_W + PAD,
    copies, duplicateCount: copies.filter(c => c.dupIndex > 1).length,
    links: drawEdges.map(e => ({ from: e.from, to: e.to, self: e.self })),
  };
}

function crossingsOf(layout) {
  if (!layout.copies) return null;
  const pos = new Map(layout.copies.map(c => [c.key, c]));
  let cross = 0;
  const fwd = layout.edges;
  return { copies: layout.copies.length, extra: layout.duplicateCount, cross, edges: fwd.length, posSize: pos.size };
}

const state = { scale: 0.5, selected: null, untangled: false, query: "" };
let lastScrolled = null;

function trunc(s, n) { return s.length > n ? s.slice(0, n - 1) + "…" : s; }
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function nodeFill(n) {
  if (n.kind === "form") return "#dae8fc";
  if (n.kind === "ctrl") return "#d5e8d4";
  if (n.kind === "port") return "#fff2cc";
  if (n.rank >= LAYOUT.maxDepth + 2) return "#f7f7f5";
  return n.rank === 1 ? "#eef1f4" : "#e4e7ec";
}
function barColor(n) {
  if (n.kind === "form") return "#6c8ebf";
  if (n.kind === "ctrl") return "#82b366";
  if (n.kind === "port") return "#d6b656";
  return null;
}

function svgEl(name, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", name);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function render() {
  const root = document.getElementById("app");
  const prev = document.querySelector(".scroll");
  const sl = prev ? prev.scrollLeft : 0;
  const st = prev ? prev.scrollTop : 0;
  const qEl = document.getElementById("q");
  const focused = qEl && document.activeElement === qEl;
  const caret = focused ? qEl.selectionStart : 0;

  const q = state.query.trim().toLowerCase();
  const matches = q
    ? LAYOUT.nodes.filter(n => n.label.toLowerCase().includes(q)).sort((a, b) => a.rank - b.rank || a.label.localeCompare(b.label))
    : [];
  const matchSet = new Set(matches.map(m => m.id));
  const chain = state.selected ? computeChain(state.selected) : null;
  const info = chain ? chainInfoOf(chain, state.selected) : null;
  const chainLayout = chain ? computeChainLayout(chain, state.untangled) : null;
  const sel = state.selected ? LAYOUT.nodeById.get(state.selected) : null;
  const s = DATA.stats;
  const width = chainLayout ? chainLayout.width : LAYOUT.width;
  const height = chainLayout ? chainLayout.height : LAYOUT.height;

  const scaleBtns = [0.15, 0.3, 0.5, 0.75, 1].map(z =>
    '<button type="button" class="pill' + (state.scale === z ? " active" : "") + '" data-act="scale" data-z="' + z + '">' + Math.round(z * 100) + '%</button>'
  ).join("");

  const hits = !state.selected && matches.length
    ? '<div class="results">' + matches.slice(0, 12).map(m =>
      '<div class="hit" role="button" tabindex="0" data-act="hit" data-id="' + m.id + '"><span class="kind">' + kindName[m.kind] + '</span><span class="mono grow">' + esc(m.label) + '</span><span class="dim">' + esc(m.module) + '</span></div>'
    ).join("") + "</div>"
    : (q && !matches.length ? '<div class="dim">Ничего не найдено — поиск идёт только по узлам диаграммы.</div>' : "");

  const callout = chain && info
    ? '<div class="callout">Режим цепочки: показаны только узлы, связанные с выбранным — ' + chain.nodes.size + ' из ' + LAYOUT.nodes.length +
      ' узлов и ' + chain.edges.size + ' из ' + LAYOUT.edges.length + ' связей; остальные скрыты, видимые подтянуты вверх. ' +
      'В цепочке: ' + info.forms + ' форм, ' + info.ctrls + ' контроллеров, ' + info.ports + ' портлетов, ' +
      info.viewsCount + ' вьюх, ' + info.leaves.length + ' конечных вьюх. ' +
      (state.untangled
        ? "Размотано копиями узлов: " + chainLayout.duplicateCount + " дополнительных копий, каждая связь идёт в свою копию."
        : "«Разматать связи» размножает узлы: у каждого входа своя копия, и кривые идут рядом.") +
      " Сброс: кнопка, клик по фону или Esc.</div>"
    : "";

  const sideSel = sel && info ? (
    '<section class="card"><h2>Выбранный узел <span class="dim">' + kindName[sel.kind] + '</span></h2><div class="body">' +
    '<div class="mono" style="word-break:break-all;font-weight:600">' + esc(sel.label) + '</div>' +
    '<div class="dim" style="margin:4px 0 8px">' + esc(sel.module) + '</div>' +
    (info.initiators.length ? '<div class="dim" style="margin-bottom:4px">Инициаторы в цепочке (' + info.initiators.length + ')</div><div class="list">' +
      info.initiators.map(id => '<div class="link" role="button" tabindex="0" data-act="choose" data-id="' + id + '">' + esc(trunc(LAYOUT.nodeById.get(id).label, 40)) + '</div>').join("") +
      '</div>' : "") +
    (info.leaves.length ? '<div class="dim" style="margin:8px 0 4px">Конечные вьюхи (' + info.leaves.length + ')</div><div class="list">' +
      info.leaves.map(id => '<div class="link" role="button" tabindex="0" data-act="choose" data-id="' + id + '">' + esc(trunc(LAYOUT.nodeById.get(id).label, 40)) + '</div>').join("") +
      '</div>' : "") +
    '<button type="button" class="btn" data-act="reset" style="margin-top:10px">Сбросить — показать всё</button></div></section>'
  ) : "";

  root.innerHTML =
    '<div class="wrap">' +
    '<div><h1>Полная диаграмма связей: формы метаданных → вьюхи Locko</h1>' +
    '<p class="muted">Поиск по узлам. Клик по узлу оставляет только цепочку от инициаторов до конечных вьюх, остальное скрывается. Системные вьюхи платформы (EleWise.*) не входят. Файл открывается с диска, сервер не нужен.</p></div>' +
    '<div class="stats">' +
    stat(LAYOUT.nodes.length, "Узлов на диаграмме") + stat(s.edges, "Связей") + stat(s.forms, "Форм всего") +
    stat(s.views, "Вьюх всего") + stat(LAYOUT.maxDepth, "Макс. глубина") +
    '</div>' +
    '<div class="controls"><input id="q" type="search" placeholder="Поиск узла: имя формы, контроллера или вьюхи…" value="' + esc(state.query) + '">' +
    (q ? '<span class="dim">' + matches.length + ' совпадений' + (matches.length > 12 ? " · показаны первые 12" : "") + '</span>' : "") +
    '<span class="spacer"></span><span class="dim">Масштаб:</span>' + scaleBtns +
    (chain ? '<button type="button" class="pill' + (state.untangled ? " active" : "") + '" data-act="untangle">' + (state.untangled ? "Убрать дубли" : "Разматать связи") + '</button>' : "") +
    (state.selected ? '<button type="button" class="btn primary" data-act="reset">Сбросить выделение — показать всё</button>' : "") +
    '</div>' + hits + callout +
    '<div class="main"><div class="scroll"></div><div class="side">' +
    '<section class="card"><h2>Легенда</h2><div class="body legend">' +
    legend("#dae8fc", "#6c8ebf", "Инициаторы: формы метаданных") +
    legend("#d5e8d4", "#82b366", "Инициаторы: контроллеры") +
    legend("#fff2cc", "#d6b656", "Инициаторы: портлеты") +
    legend("#eef1f4", null, "Вьюха · глубина 0") +
    legend("#e4e7ec", null, "Вьюха · глубина 1–2") +
    legend("#f7f7f5", null, "Вьюха без связи от инициаторов") +
    '</div></section>' + sideSel +
    '<div class="note">50 форм и 34 контроллера без ссылок на вьюхи Locko не показаны. 123 вьюхи недостижимы от инициаторов: 23 корня с потомками и 97 изолированных. Одна вьюха рекурсивна: WorflowInstanceHistory/WorkflowInstancePart.</div>' +
    '</div></div></div>';

  const host = root.querySelector(".scroll");
  const svg = svgEl("svg", {
    width: width * state.scale, height: height * state.scale,
    viewBox: "0 0 " + width + " " + height, role: "img",
  });
  svg.appendChild(svgEl("rect", { x: 0, y: 0, width, height, fill: "transparent", "data-act": "reset" }));
  const headers = chainLayout && chainLayout.copies
    ? [...chainLayout.usedRanks].sort((a, b) => a - b).map(r => ({ r, t: r === 0 ? "Инициаторы" : (LAYOUT.rankTitles[r] || ("Копии · шаг " + r)) }))
    : LAYOUT.rankTitles.map((t, r) => ({ r, t })).filter(h => !chainLayout || chainLayout.usedRanks.has(h.r));
  for (const h of headers) {
    const text = svgEl("text", { x: LAYOUT.xOf(h.r), y: 18, "font-size": 11, "font-weight": 600, fill: "#6b6b6b" });
    text.textContent = h.t;
    svg.appendChild(text);
  }
  const edgeList = chainLayout ? chainLayout.edges : LAYOUT.edges;
  for (const e of edgeList) {
    svg.appendChild(svgEl("path", {
      d: e.d, fill: "none",
      stroke: chainLayout ? "#2f6fad" : "#b3b3b3",
      "stroke-width": chainLayout ? 1.6 : 0.7,
      opacity: chainLayout ? 0.95 : 0.28,
    }));
  }
  if (chainLayout && chainLayout.copies) {
    for (const c of chainLayout.copies) {
      const n = LAYOUT.nodeById.get(c.orig);
      svg.appendChild(nodeGroup(n, c.x, c.y, state.selected === c.orig, false, c.dupIndex > 1, c.dupTotal > 1 ? n.label + " ·" + c.dupIndex : n.label, "copy", c.orig,
        kindName[n.kind] + " · " + n.label + (c.dupTotal > 1 ? " · копия " + c.dupIndex + " из " + c.dupTotal : "") + " · " + n.module));
    }
  } else {
    for (const n of LAYOUT.nodes) {
      if (chain && !chain.nodes.has(n.id)) continue;
      const ny = chainLayout ? chainLayout.cy.get(n.id) : n.y;
      const orphan = n.kind === "view" && n.rank >= LAYOUT.maxDepth + 2;
      svg.appendChild(nodeGroup(n, n.x, ny, state.selected === n.id, !state.selected && matchSet.has(n.id), orphan, n.label, "choose", n.id,
        kindName[n.kind] + " · " + n.label + " · " + n.module));
    }
  }
  host.appendChild(svg);

  if (state.selected && state.selected !== lastScrolled && sel) {
    const ny = chainLayout ? chainLayout.cy.get(state.selected) : sel.y;
    host.scrollLeft = Math.max(0, (sel.x + sel.w / 2) * state.scale - host.clientWidth / 2);
    host.scrollTop = Math.max(0, (ny + sel.h / 2) * state.scale - host.clientHeight / 2);
    lastScrolled = state.selected;
  } else {
    host.scrollLeft = sl;
    host.scrollTop = st;
  }
  const input = document.getElementById("q");
  input.addEventListener("input", () => { state.query = input.value; render(); });
  if (focused) { input.focus(); input.setSelectionRange(caret, caret); }
}

function stat(value, label) {
  return '<div class="stat"><b>' + value + '</b><span>' + label + '</span></div>';
}
function legend(fill, bar, label) {
  return '<div class="leg"><svg width="26" height="12"><rect x="0" y="0" width="26" height="12" rx="2" fill="' + fill + '" stroke="#d0d0d0" stroke-width="0.7"/>' +
    (bar ? '<rect x="0" y="0" width="4" height="12" fill="' + bar + '"/>' : "") +
    '</svg><span>' + label + '</span></div>';
}
function nodeGroup(n, x, y, isSel, isMatch, dashed, label, act, id, title) {
  const g = svgEl("g", { "data-act": act, "data-id": id, "data-orig": id, style: "cursor:pointer" });
  const t = svgEl("title", {});
  t.textContent = title;
  g.appendChild(t);
  g.appendChild(svgEl("rect", {
    x, y, width: n.w, height: n.h, rx: 3,
    fill: isSel ? "#e7f0fa" : nodeFill(n),
    stroke: isSel || isMatch ? "#2f6fad" : "#c8c8c8",
    "stroke-width": isSel ? 2.2 : isMatch ? 1.6 : 0.7,
    "stroke-dasharray": dashed ? "4 2" : "0",
  }));
  const bar = barColor(n);
  if (bar) g.appendChild(svgEl("rect", { x, y, width: 4, height: n.h, fill: bar }));
  const text = svgEl("text", { x: x + (bar ? 10 : 6), y: y + 13, "font-size": 10, fill: "#1c1c1c" });
  text.textContent = trunc(label, 38);
  g.appendChild(text);
  return g;
}

function choose(id) {
  state.untangled = false;
  state.selected = id;
  lastScrolled = null;
  render();
}

function boot() {
  const root = document.getElementById("app");
  root.addEventListener("click", (ev) => {
    const t = ev.target.closest("[data-act]");
    if (!t || !root.contains(t)) return;
    const act = t.getAttribute("data-act");
    if (act === "reset") choose(null);
    else if (act === "scale") { state.scale = Number(t.getAttribute("data-z")); render(); }
    else if (act === "untangle") { state.untangled = !state.untangled; lastScrolled = null; render(); }
    else if (act === "hit") { state.query = ""; choose(t.getAttribute("data-id")); }
    else if (act === "choose") choose(t.getAttribute("data-id"));
    else if (act === "copy") {
      const orig = t.getAttribute("data-orig");
      if (orig !== state.selected) choose(orig);
    }
  });
  window.addEventListener("keydown", (e) => { if (e.key === "Escape") choose(null); });
  render();
}

(function (root) {
  root.LockoApp = { LAYOUT, computeChain, computeChainLayout, crossingsOf, DATA };
})(typeof window !== "undefined" ? window : globalThis);

if (typeof document !== "undefined") boot();

</script>
</body>
</html>
